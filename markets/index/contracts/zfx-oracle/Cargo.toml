[package]
name = "zfx-oracle"
description = "Public NEAR oracle for ZFX Markets: stores reporter-signed OraclePrint v1 records, verifiable by anyone"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Verify signatures inside wasm with ed25519-dalek (zfx-oracle-print::verify, strict) instead of
# the NEAR host function. Used only to measure the gas difference.
dalek-verify = []

[dependencies]
near-sdk = "5.30.1"
zfx-oracle-print = { path = "../../crates/zfx-oracle-print", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
