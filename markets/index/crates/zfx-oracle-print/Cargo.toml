[package]
name = "zfx-oracle-print"
description = "Canonical OraclePrint v1 encoding, hashing and ed25519 verification (no_std)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["std"]
std = []

[dependencies]
sha2 = { version = "0.10", default-features = false }
ed25519-dalek = { version = "2", default-features = false }

[dev-dependencies]
hex = "0.4"
serde_json = "1"
