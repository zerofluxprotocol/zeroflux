[workspace]
resolver = "3"
members = [
  "crates/obkit-wire",
  "crates/obkit-engine",
  "crates/obkit-journal",
  "crates/obkit-node",
  "crates/obkit-client",
  "crates/obkit-near",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/numinousmuses/obkit"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
rustc-hash = "2"
blake3 = "1"
crc32fast = "1"
ed25519-dalek = "2"
bs58 = "0.5"
obkit-wire = { path = "crates/obkit-wire" }
obkit-engine = { path = "crates/obkit-engine" }
obkit-journal = { path = "crates/obkit-journal" }
obkit-client = { path = "crates/obkit-client" }
obkit-node = { path = "crates/obkit-node" }

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

[profile.bench]
debug = 1
