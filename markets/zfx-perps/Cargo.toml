[workspace]
resolver = "3"
members = [
  "crates/zfx-perps-wire",
  "crates/zfx-perps-engine",
  "crates/zfx-perps-journal",
  "crates/zfx-perps-node",
  "crates/zfx-perps-client",
  "crates/zfx-perps-near",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/zerofluxprotocol/zeroflux"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
rustc-hash = "2"
blake3 = "1"
crc32fast = "1"
ed25519-dalek = "2"
bs58 = "0.5"
zfx-perps-wire = { path = "crates/zfx-perps-wire" }
zfx-perps-engine = { path = "crates/zfx-perps-engine" }
zfx-perps-journal = { path = "crates/zfx-perps-journal" }
zfx-perps-client = { path = "crates/zfx-perps-client" }
zfx-perps-node = { path = "crates/zfx-perps-node" }

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

[profile.bench]
debug = 1
