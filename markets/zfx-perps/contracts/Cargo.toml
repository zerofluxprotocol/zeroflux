[workspace]
resolver = "3"
members = ["obkit-settlement", "mock-ft"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
obkit-wire = { path = "../crates/obkit-wire" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
