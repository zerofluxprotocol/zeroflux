[package]
name = "obkit-settlement"
description = "NEAR custody and settlement contract for an obkit hybrid exchange."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
obkit-wire = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
ed25519-dalek = "2"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
