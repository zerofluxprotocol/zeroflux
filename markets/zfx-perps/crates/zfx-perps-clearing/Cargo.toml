[package]
name = "zfx-perps-clearing"
description = "Clearing core shared by the NEAR clearing contract and the off-chain engine: signed order and oracle print formats, isolated-margin ledger, fill verification, liquidation, funding."
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["native"]
# Native ed25519/sha256 (node, engine, tests). The contract uses NEAR host functions instead.
native = ["dep:ed25519-dalek", "dep:sha2"]
# Deterministic fixtures for tests in this and dependent crates.
testkit = ["native"]

[dependencies]
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
ed25519-dalek = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
proptest = "1"
rand = { version = "0.9", features = ["small_rng"] }
zfx-perps-clearing = { path = ".", features = ["testkit"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde_json = "1"
