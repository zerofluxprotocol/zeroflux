[workspace]
resolver = "2"
members = [
    "crates/zfx-verify",
    "crates/zfx-node",
    "crates/zfx-wallet",
    "crates/zfx-research",
    "miner/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/zerofluxprotocol/zeroflux"

[workspace.dependencies]
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fips205 = { version = "0.5", default-features = false, features = ["default-rng", "slh-dsa-sha2-128s", "slh-dsa-sha2-192s"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.8"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["json"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"

[profile.dev.package."*"]
opt-level = 3
