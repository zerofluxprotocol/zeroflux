[package]
name = "zpu-cli"
description = "ZFX mining client (zfx-miner, also installed as zpu-cli): connects GPU/CPU miner backends to a ZeroFlux node or the NEAR mining proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zpu-cli"
path = "src/main.rs"

[dependencies]
zfx-verify = { path = "../../crates/zfx-verify" }
serde_json.workspace = true
hex.workspace = true
ureq.workspace = true
rand.workspace = true
