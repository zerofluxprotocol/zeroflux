[package]
name = "pv-provider"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["near-sdk"]
near-sdk = ["dep:nearai-inference-sdk"]

[dependencies]
pv-core.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
bytes.workspace = true
async-trait = "0.1"
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
url.workspace = true
hex.workspace = true
rand.workspace = true
nearai-inference-sdk = { version = "=0.3.0", optional = true }

[dev-dependencies]
# Same version the NEAR AI SDK uses; offline DCAP verification of recorded quotes.
dcap-qvl = "0.7"
