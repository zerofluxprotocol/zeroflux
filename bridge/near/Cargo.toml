[workspace]
resolver = "2"
members = ["wzfx", "test-ft", "pow-verifier", "near-pow", "zfx-mine", "zfx-light", "zfx-mine-opt"]

[workspace.dependencies]
near-sdk = { version = "5.30", default-features = false }  # no wee_alloc (RUSTSEC-2022-0054, unmaintained); std allocator
near-contract-standards = "5.30"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
