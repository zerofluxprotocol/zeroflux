[package]
name = "near-pow"
description = "ZeroFlux proof-of-work verification inside NEAR contracts: the consensus sources compiled for wasm, plus per-epoch weight storage"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["rlib"]

[dependencies]
near-sdk.workspace = true
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
hex = "0.4"
