[package]
name = "zfx-light"
description = "ZeroFlux proof-of-work light client on NEAR: verifies every header on-chain and mints from Merkle-proven deposits without a committee"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
near-contract-standards.workspace = true
near-pow = { path = "../near-pow" }
hex = "0.4"
