[package]
name = "pow-verifier"
description = "Research prototype: verify a ZeroFlux ZFX-FP8C attempt on NEAR, compiled from the exact consensus sources (trust-minimized bridge feasibility experiment)"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
hex = "0.4"
